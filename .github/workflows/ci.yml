name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}
jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck setup.sh scripts/*.sh bin/*

  test-ubuntu:
    name: Ubuntu Integration Test
    runs-on: ubuntu-latest
    needs: shellcheck
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak curl tar git jq
          
      - name: Run setup.sh (Dry Run / CI mode)
        run: |
          ./setup.sh --dev
