name: CI

on:
  push:
    branches: [ main ]
  pull_request:

permissions: {}
jobs:
  shellcheck:
    name: Shellcheck
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Run ShellCheck
        run: shellcheck setup.sh scripts/*.sh scripts/setup/*.sh

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
      - name: Run actionlint
        run: |
          bash -c "$(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)"
          ./actionlint

  test-ubuntu:
    name: Ubuntu Validation Test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [shellcheck, actionlint]
    steps:
      - uses: actions/checkout@v7
      
      - name: Install Dependencies
        run: |
          sudo apt-get update -o Acquire::http::Timeout="15" -o Acquire::Retries="3"
          sudo apt-get install -y -o Acquire::http::Timeout="15" -o Acquire::Retries="3" \
            flatpak curl tar git jq rpm2cpio cpio
          
      - name: Test Core Config Wiring
        run: |
          bash -n setup.sh
          bash -n scripts/*.sh scripts/setup/*.sh
          ./setup.sh --help

